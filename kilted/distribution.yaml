%YAML 1.1
# ROS distribution file
# see REP 143: http://ros.org/reps/rep-0143.html
---
release_platforms:
  debian:
  - bookworm
  ubuntu:
  - noble
repositories:
  hel_fot_control:
    release:
      packages:
      - fot_control
      tags:
        release: version/{version}
      url: DOES-NOT-EXIST
      version: 1.0.0
