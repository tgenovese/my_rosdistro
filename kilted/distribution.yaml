      type: git
      url: https://gitlab.vtti.vt.edu/hel/GeneralSoftware/sol4/hel-ros-fot-control.git
      version: release/1.0
    status: developed
  my_package:
    release:
      tags:
        release: release/kilted/{package}/{version}
      url: https://github.com/tgenovese/my_package-release.git
      version: 0.0.1-1
    source:
      type: git
      url: https://github.com/tgenovese/my_package.git
      version: main
    status: developed
type: distribution
version: 2
